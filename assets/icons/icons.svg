<!--
  MOSAIC — icon sprite
  One <symbol> per icon. Nothing here renders on its own (the
  wrapping <svg> is display:none) — pages reference an icon with:

    <svg class="icon"><use href="assets/icons/icons.svg#icon-Islands"></use></svg>

  Add a new category icon by adding a new <symbol id="icon-...">
  here, no other file needs a new asset.
-->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">

  <symbol id="icon-arrow-left" viewBox="0 0 24 24">
    <path d="M19 12H5"></path>
    <path d="M11 6l-6 6 6 6"></path>
  </symbol>
	
  <symbol id="leaf" viewBox="0 0 24 24">
    <rect x="3" y="8" width="18" height="12" rx="1.5"></rect>
    <path d="M3 8l2-4h3.5L6.5 8"></path>
    <path d="M10 8l2-4h3.5l-2 4"></path>
    <path d="M17 8l1.6-4H21l-1.4 4"></path>
  </symbol>

  <symbol id="icon-music" viewBox="0 0 24 24">
    <path d="M9 17.5V6l10-2v11.5"></path>
    <circle cx="6.5" cy="17.5" r="2.5" fill="currentColor" stroke="none"></circle>
    <circle cx="16.5" cy="15.5" r="2.5" fill="currentColor" stroke="none"></circle>
  </symbol>

  <symbol id="icon-Villagers" viewBox="0 0 24 24">
    <path d="M7 6h10a4.5 4.5 0 0 1 4.5 4.5v3A4.5 4.5 0 0 1 17 18c-.9 0-1.5-.4-2.1-1.1L13.3 15h-2.6l-1.6 1.9C8.5 17.6 7.9 18 7 18a4.5 4.5 0 0 1-4.5-4.5v-3A4.5 4.5 0 0 1 7 6z"></path>
    <path d="M6.5 9.5v3M5 11h3"></path>
    <circle cx="16" cy="10" r="1" fill="currentColor" stroke="none"></circle>
    <circle cx="18.2" cy="12.4" r="1" fill="currentColor" stroke="none"></circle>
  </symbol>

  <symbol id="icon-Events" viewBox="0 0 24 24">
    <path d="M7 4h10v3.5a5 5 0 0 1-10 0V4z"></path>
    <path d="M7 5.5H4.5v1.5a3 3 0 0 0 3 3M17 5.5h2.5v1.5a3 3 0 0 1-3 3"></path>
    <path d="M12 12.5V16"></path>
    <path d="M9 19.5h6"></path>
    <path d="M10 16h4v3.5h-4z"></path>
  </symbol>

  <symbol id="icon-Museum" viewBox="0 0 24 24">
    <path d="M4.5 11a7.5 7.5 0 0 1 15 0"></path>
    <path d="M3.5 11h17"></path>
    <path d="M5.5 11l1 8.5h11l1-8.5"></path>
  </symbol>

  <symbol id="icon-Games" viewBox="0 0 24 24">
    <rect x="4" y="8" width="16" height="11" rx="1.5"></rect>
    <path d="M9 8V6.5A1.5 1.5 0 0 1 10.5 5h3A1.5 1.5 0 0 1 15 6.5V8"></path>
    <path d="M4 13.5h16"></path>
  </symbol>

</svg>
