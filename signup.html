<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create account · Mosaic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/variables.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/auth.css">
</head>
<body data-page="signup">

  <div class="auth-shell">
    <section class="auth-visual">
      <a href="signin.html" class="brand">
        <span class="brand-mark"><span></span><span></span><span></span><span></span></span>
        Mosaic
      </a>
      <div class="collage-grid" style="grid-auto-rows:70px;">
        <div class="collage-tile span-1 tall" style="background:rgba(255,255,255,.25)"></div>
        <div class="collage-tile span-2" style="background:rgba(255,255,255,.3)"></div>
        <div class="collage-tile span-1" style="background:rgba(255,255,255,.2)"></div>
        <div class="collage-tile span-2 tall" style="background:rgba(255,255,255,.3)"></div>
      </div>
      <blockquote>"Rate, review, and share — all in one place."</blockquote>
    </section>

    <section class="auth-form-side">
      <div class="auth-box">
        <h1>Create your account</h1>
        <p class="sub">Join Mosaic and start building your feed.</p>

        <form id="signUpForm" novalidate>
          <div class="form-group">
            <label for="signUpName">Full name</label>
            <input type="text" id="signUpName" name="name" autocomplete="name" required>
          </div>
          <div class="form-group">
            <label for="signUpUsername">Username</label>
            <input type="text" id="signUpUsername" name="username" autocomplete="username" required>
          </div>
          <div class="form-group">
            <label for="signUpEmail">Email</label>
            <input type="email" id="signUpEmail" name="email" autocomplete="email" required>
          </div>
          <div class="form-group">
            <label for="signUpPassword">Password</label>
            <input type="password" id="signUpPassword" name="password" autocomplete="new-password" required>
            <p class="hint">At least 6 characters.</p>
            <p class="form-error" id="signUpError"></p>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Create account</button>
        </form>

        <p class="auth-switch">Already have an account? <a href="signin.html">Sign in</a></p>
      </div>
    </section>
  </div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/nav.js" defer></script>
  <script src="assets/js/auth.js" defer></script>
</body>
</html>
